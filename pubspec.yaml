name: ciphercalc
description: An offline calculator with an expression-locked encrypted file vault.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cryptography: 2.9.0
  file_picker: ^10.3.3
  path_provider: ^2.1.5
dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
